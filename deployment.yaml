apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-water-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-water-dashboard
  template:
    metadata:
      labels:
        app: smart-water-dashboard
    spec:
      containers:
      - name: dashboard
        image: dineshchoco/smart-water-monitor:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-water-service
spec:
  type: NodePort
  selector:
    app: smart-water-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
